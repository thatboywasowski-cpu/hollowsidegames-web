<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="/styles.css?v=20260722j">

    <link rel="stylesheet" href="/account.css?v=20260722j">
</head>
<body>
    <div class="page-shell">
        <div class="dust-layer" aria-hidden="true"></div>
        <header class="site-header">
            <div class="site-header-bar">
                <a class="brand" href="/"><span class="brand-mark">H</span><span class="brand-text"><strong>Hollowside Games</strong></span></a>
                <nav class="nav-links" aria-label="Primary">
                    <a class="nav-link" href="/">Home</a>
                    <a class="nav-link" href="/help">Help</a>

                </nav>
            </div>
        </header>
        <main class="site-main">
            <p class="page-status" id="game-status" hidden></p>
            <section class="hero-grid">
                <article class="hero-card">
                    <div class="pill-row" id="game-platforms"></div>
                    <h1 class="page-heading" id="game-title">Loading...</h1>
